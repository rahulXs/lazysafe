[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lazysafe"
dynamic = ["version"]
description = "safely adopt python 3.15 lazy imports: analyze, probe, apply, verify, measure"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Rahul Sharma", email = "rahulxsh@gmail.com" }]
keywords = [
    "python", "lazy-imports", "pep810", "startup", "performance",
    "import-time", "side-effects", "verification", "cpython315",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = []

[project.scripts]
lazysafe = "lazysafe.cli:main"

[project.urls]
Homepage = "https://github.com/rahulxs/lazysafe"
Repository = "https://github.com/rahulxs/lazysafe"
Issues = "https://github.com/rahulxs/lazysafe/issues"
Changelog = "https://github.com/rahulxs/lazysafe/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/lazysafe/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/lazysafe"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "C901"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "mypy>=1.8",
    "build>=1.2",
    "twine>=6",
]
