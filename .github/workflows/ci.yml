name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: ubuntu-latest, python: "3.14" }
          - { os: macos-latest, python: "3.14" }
          - { os: windows-latest, python: "3.14" }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync
      - run: uv run pytest -q
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  # Required native qualification. This job must fail rather than skip when the
  # selected 3.15 build cannot actually defer an explicit lazy import, so it is
  # never continue-on-error. It qualifies ubuntu only: it says nothing about the
  # Windows or macOS paths.
  # Job IDs may only contain alphanumerics, '_' and '-', so this is 315 not 3.15.
  native-lazy-315:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.15"
      - run: uv sync
      - name: report interpreter build
        run: |
          uv run python -VV
          uv run python -c "import sys; print(sys.implementation.name, sys.implementation.cache_tag)"
      - name: report accepted lazy modes
        run: |
          for mode in normal all none; do
            if uv run python -X "lazy_imports=$mode" -c "pass" 2>/dev/null; then
              echo "lazy_imports=$mode: accepted"
            else
              echo "lazy_imports=$mode: rejected"
            fi
          done
      - name: run suite with required native lazy qualification
        run: uv run pytest -q
        env:
          LAZYSAFE_REQUIRE_NATIVE_LAZY: "1"
      - run: uv run ruff check .
      - run: uv run ruff format --check .
